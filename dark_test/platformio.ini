; Dark-measurement protocol firmware for the ItsyBitsy M0.
;
; The LED is driven externally by a 555, so the micro does not touch the
; LED pin. Button B walks the operator through:
;   1) dark pre  (555 disconnected)
;   2) reference (blank cuvette, 555 reconnected)
;   3) sample    (sample cuvette)
;   4) dark post (555 disconnected)
;
; Each step = 10 s settle + 30 s measurement window, sampled at 10 Hz and
; emitted as 50-sample (5 s) averages.

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit DotStar
