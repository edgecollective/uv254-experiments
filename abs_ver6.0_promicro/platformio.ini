; UV-254 absorbance measurement firmware, Pro Micro nRF52840 port of ver6.0.
;
; Target: the same "ProMicro NRF52840" board used for the MeshCore Rook.
; Pinout follows the Rook conventions so a wired-up Rook or bare Pro Micro
; can host this firmware for sequencing tests:
;   I2C:      SDA=Arduino 8 (P1.04), SCL=Arduino 7 (P0.11)   (from variant.h)
;   Button A: Arduino 6 (P1.00) - matches Rook PIN_USER_BTN
;   Button B: Arduino 9 (P1.06) - free GPIO on Rook by default
;   Detect:   Arduino 15 (P0.02 / AIN0) - first ADC pin on the Pro Micro
;
; Detector input is optional for sequencing tests; leave it floating or tie
; to a pot on 3.0V. State-machine, prompts, timing, buttons, serial CSV all
; work without a real detector.

[platformio]
boards_dir = boards

[env:promicro_nrf52840]
platform = nordicnrf52
platform_packages = framework-arduinoadafruitnrf52 @ 1.10700.0
board = promicro_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
