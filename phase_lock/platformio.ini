; Phase-locked ADC sampling variant of the LED test firmware.
; Same TCC0-direct 200 Hz LED drive as coherent_averaging/, but instead of
; averaging over an integer number of modulation periods, we align every ADC
; conversion to a fixed phase of the LED waveform by polling TCC0->COUNT.
;
; Upload via the SAM-BA bootloader (double-tap RESET to enter it).

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit DotStar
