; LED "bake" test, ItsyBitsy M0 (SAMD21) variant.
; After first B press drives the LED at 200 Hz and streams (t_seconds, adc_count)
; once per second on the serial port until B is pressed again.
;
; Notes vs the nRF52840 build:
;  - No TinyUSB; SAMD21 uses the stock Arduino USB CDC.
;  - SAMD21 ADC is 12-bit max (0..4095), not 14-bit.
;  - Upload via the SAM-BA bootloader (double-tap RESET to enter it).

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
