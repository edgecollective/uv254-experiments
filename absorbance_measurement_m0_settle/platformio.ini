; Absorbance measurement, M0, "settle" variant.
;
; LED is driven by an external 555 (soldered) - the micro does NOT drive the
; LED pin. Blank and sample measurements each run 10 rounds of 5-second
; averages sampled at 10 Hz (50 samples per round, 50 s total per
; measurement). The last round's average is used as the light-intensity
; value for the absorbance calculation. All rounds are streamed to the
; serial monitor so we can eyeball whether 50 s is enough settling.

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit DotStar
