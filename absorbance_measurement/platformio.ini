; UV-254 absorbance measurement firmware (revised).
; Modulates the UV LED at 200 Hz (peak of the detector chain bandpass, per freq_test/exp2.png)
; and uses a 3 s LED warm-up plus a post-warm-up throwaway sample to avoid the first-sample
; bias seen during LOD characterization in lod_test/.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
