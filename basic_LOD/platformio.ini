; Basic LOD test firmware, ItsyBitsy nRF52840.
;
; Uses the absorbance_july7 measurement protocol (2-min warm-up, then each
; measurement = 5 rounds settle + 10 rounds avg = 75 s) but does nothing but
; repeated "blank" measurements back-to-back so we can characterize
; blank-to-blank variation and derive an absorbance limit-of-detection.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
