; Basic LOD test with cuvette swaps, ItsyBitsy nRF52840.
;
; Same measurement protocol as absorbance_july7 (2-min warm-up, 5 rounds
; settle + 10 rounds avg per measurement), but between blanks the operator
; swaps the cuvette by hand. Button B advances (start next blank),
; button A stops. Runs up to 20 blank cycles.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
