; UV-254 absorbance measurement firmware, "settle" variant, ItsyBitsy nRF52840.
;
; LED is driven by an external 555 (soldered) - the micro does NOT drive the
; LED pin. Blank and sample measurements each run 10 rounds of 5-second
; averages sampled at 10 Hz (50 samples per round, 50 s total per
; measurement). The mean of the last 5 rounds is used as the light-intensity
; value for the absorbance calculation; all rounds stream to the serial
; monitor so we can eyeball settling.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
