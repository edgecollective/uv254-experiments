; UV-254 absorbance measurement firmware, ver7.0 (2-point AFFINE), ItsyBitsy nRF52840.
;
; LED is driven by an external 555 (soldered) - the micro does NOT drive the
; LED pin. On boot the firmware runs a 2 min warm-up (streamed to serial for
; the record) before enabling the buttons. After warm-up, each button press
; triggers a measurement with 3 rounds of settle followed by 10 rounds
; averaged for the final I value.
;
; Ver7.0 replaces the single-standard multiplicative correction of ver6.1
; with a two-standard affine correction:  A_corr = m * A_raw + b.
; Defaults: low std = 0.010 cm^-1, high std = 0.100 cm^-1.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
