; LED averaging test: LED at 200 Hz, ADC sampled at 10 Hz, one averaged
; reading emitted every 2 s (20 samples per average).
;
; Upload via the SAM-BA bootloader (double-tap RESET to enter it).

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit DotStar
