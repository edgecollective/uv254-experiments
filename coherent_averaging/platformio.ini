; Long-duration LED test, ItsyBitsy M0 (SAMD21).
; Drives the UV LED at 200 Hz from boot and streams a single ADC reading per
; second on serial. Use to watch long-term drift / thermal stability.

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit DotStar
