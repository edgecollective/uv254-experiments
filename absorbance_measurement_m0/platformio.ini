; UV-254 absorbance measurement firmware, ItsyBitsy M0 (SAMD21) build.
; 200 Hz LED modulation (peak of the detector chain bandpass, per freq_test/exp2.png)
; and a 5 s LED warm-up + throwaway sample before averaging.
;
; Notes vs the nRF52840 build:
;  - No TinyUSB; SAMD21 uses the stock Arduino USB CDC.
;  - analogReadResolution(16) uses hardware oversampling+decimation via
;    ADC.AVGCTRL to lift the native 12-bit result to a 0..65535 range.
;  - Upload via the SAM-BA bootloader (double-tap RESET to enter it).

[env:itsybitsy_m0]
platform = atmelsam
board = adafruit_itsybitsy_m0
framework = arduino

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
