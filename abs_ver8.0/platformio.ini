; UV-254 absorbance measurement firmware, ver8.0 (3-point LSQ AFFINE), ItsyBitsy nRF52840.
;
; LED is driven by an external 555 (soldered) - the micro does NOT drive the
; LED pin. On boot the firmware runs a 2 min warm-up (streamed to serial for
; the record) before enabling the buttons. After warm-up, each button press
; triggers a measurement with 3 rounds of settle followed by 10 rounds
; averaged for the final I value.
;
; Ver8.0 extends the ver7.0 2-point affine correction to a 3-point
; least-squares linear fit:  A_corr = m * A_raw + b, with (m, b) chosen to
; minimize the squared residual over three fluorescein standards.
; Defaults: low std = 0.020 cm^-1, mid std = 0.100 cm^-1, high std = 0.150 cm^-1.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
