; LED drift logger, ItsyBitsy nRF52840.
;
; LED is driven by an external 555 (soldered). Button B starts (and re-presses
; stop) a continuous 10 Hz sampling stream. Every 50 samples (5 s) one CSV
; row is emitted so we can look at LED output vs time over a long window.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
