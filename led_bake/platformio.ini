; LED "bake" test: after first B press, drives the LED at 200 Hz and
; streams (t_seconds, adc_count) once per second on the serial port until B
; is pressed again. Use it to characterize long-term drift / warm-up of the
; UV LED beyond the 3 s used by absorbance_measurement/.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil

monitor_speed = 115200
monitor_filters = direct

build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
