; PlatformIO config for the Adafruit ItsyBitsy nRF52840 Express.
; Upload happens over the Adafruit serial DFU bootloader: double-tap RESET to
; enter bootloader mode if the auto-1200bps-touch reset isn't picked up.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino

upload_protocol = nrfutil
; upload_port = /dev/ttyACM0   ; uncomment + edit if auto-detect fails

monitor_speed = 115200
monitor_filters = direct

; Adafruit nRF52 BSP routes USB CDC `Serial` through TinyUSB.
build_flags = -DUSE_TINYUSB

lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

lib_ignore = SdFat - Adafruit Fork
